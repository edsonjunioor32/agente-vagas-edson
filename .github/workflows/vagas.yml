name: Agente de vagas

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: "Aderência mínima estimada (0-100)"
        required: false
        default: "35"
      max_jobs:
        description: "Máximo de vagas"
        required: false
        default: "100"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "perfil.json"
      - ".github/workflows/vagas.yml"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: agente-vagas
  cancel-in-progress: false

jobs:
  buscar-e-ranquear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe
        run: python -m py_compile src/pipeline.py src/scoring_v2.py src/enrichment.py src/pipeline_v2.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Executar pipeline
        env:
          MIN_SCORE: ${{ github.event.inputs.min_score || '35' }}
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '100' }}
          MAX_AGE_DAYS: "60"
          ONLY_REMOTE: "true"
          ENRICH_LIMIT: "40"
          ENRICH_SECOND_LIMIT: "60"
          ENRICH_WORKERS: "6"
          ENRICH_TIMEOUT: "10"
          MAX_HTML_BYTES: "2500000"
        run: python src/pipeline_v2.py
      - name: Validar resultados
        run: |
          test -s output/vagas_ranqueadas.json
          test -s output/vagas_ranqueadas.csv
          test -s output/resumo.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("output/vagas_ranqueadas.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("jobs"), list), "jobs ausente"
          assert data.get("count") == len(data["jobs"]), "count divergente"
          assert all(j.get("url") and j.get("title") for j in data["jobs"]), "vaga sem título/URL"
          assert all(0 <= int(j.get("score", -1)) <= 100 for j in data["jobs"]), "score fora de 0-100"
          assert all(0 <= int(j.get("coverage", -1)) <= 100 for j in data["jobs"]), "coverage ausente ou fora de 0-100"
          assert all(j.get("score_method") == "observed_evidence_v3" for j in data["jobs"]), "método de score incorreto"
          enrichment = data.get("enrichment")
          assert isinstance(enrichment, dict), "resumo de enriquecimento ausente"
          assert all(k in enrichment for k in ("attempted", "enriched", "failed", "methods")), "estatísticas de enriquecimento incompletas"
          assert enrichment["attempted"] >= enrichment["enriched"] >= 0, "estatísticas de enriquecimento inválidas"
          print(f"Resultados validados: {data['count']} vagas; enriquecidas: {enrichment['enriched']}/{enrichment['attempted']}")
          PY
      - name: Publicar resultados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos resultados."
            exit 0
          fi
          git commit -m "chore: atualizar vagas ranqueadas"
          git push
